<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="feat-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#091e1d" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#feat-bg)" />

  <!-- Ambient Glow Circles -->
  <circle cx="800" cy="250" r="280" fill="#10b981" opacity="0.1" />
  <circle cx="200" cy="100" r="200" fill="#14b8a6" opacity="0.08" />

  <!-- Left Side: Brand Typography & Value Proposition -->
  <g transform="translate(80, 160)">
    <!-- App Badge -->
    <rect width="110" height="30" rx="15" fill="#10b981" fill-opacity="0.15" />
    <text x="55" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1">SPLITSHARE</text>

    <!-- Main Title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Split Bills. Settle Up.
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Instant peer-to-peer repayments via any UPI app.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 160)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="65" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ Equal &amp; % Split</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="130" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="207" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">📱 Direct UPI Pay</text>

      <!-- Pill 3 -->
      <rect x="284" y="0" width="130" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="349" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">🔒 Zero Ads</text>
    </g>
  </g>

  <!-- Right Side: Graphic Visual / Floating Cards Illustration -->
  <g transform="translate(680, 110)" filter="url(#card-shadow)">
    <!-- Back Card -->
    <rect x="30" y="20" width="190" height="260" rx="28" fill="url(#card2)" transform="rotate(16 125 150)" opacity="0.9" />

    <!-- Front Card -->
    <rect x="-30" y="10" width="190" height="260" rx="28" fill="url(#card1)" transform="rotate(-8 65 140)" />

    <!-- Card Graphic Lines & Symbol -->
    <g transform="translate(10, 60)" fill="#ffffff">
      <rect x="0" y="0" width="80" height="12" rx="6" />
      <rect x="0" y="20" width="60" height="10" rx="5" opacity="0.8" />
      
      <!-- Big Center ₹ -->
      <text x="35" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle">₹</text>

      <!-- Settlement Indicator Pill -->
      <rect x="-10" y="130" width="100" height="24" rx="12" fill="#ffffff" fill-opacity="0.25" />
      <text x="40" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">SETTLED</text>
    </g>
  </g>
</svg>
