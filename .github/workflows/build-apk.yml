name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Generate SplitShare APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📱 Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🌐 Compile Web Application
        run: npm run build

      - name: 🔄 Sync Assets with Capacitor Android
        run: npx cap sync android

      - name: 🔨 Build APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📁 Prepare APK Output File
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/SplitShare.apk
          ls -la release-output

      - name: 🚀 Upload SplitShare.apk as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitShare-APK
          path: release-output/SplitShare.apk
          retention-days: 30
