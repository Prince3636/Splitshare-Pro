name: Build Android APK

# Trigger ONLY when manually clicked via GitHub Actions ("Run workflow")
on:
  workflow_dispatch:

jobs:
  build:
    name: Generate SplitShare APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🌐 Compile Web Application
        run: npm run build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 📱 Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🔨 Build APK & Play Console AAB Bundle with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug --no-daemon

      - name: 📁 Prepare Output Files
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/SplitShare.apk
          cp android/app/build/outputs/bundle/debug/app-debug.aab release-output/SplitShare-PlayConsole.aab
          ls -la release-output

      - name: 🚀 Upload SplitShare Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SplitShare-APK
          path: release-output/SplitShare.apk
          retention-days: 30

      - name: 📦 Upload SplitShare Google Play Console Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: SplitShare-PlayConsole-AAB
          path: release-output/SplitShare-PlayConsole.aab
          retention-days: 30
